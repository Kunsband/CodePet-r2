<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:;">
  <title>CodePet 남은 한도</title>
  <link rel="stylesheet" href="usage.css">
  <script src="usage-renderer.js" defer></script>
</head>
<body>
  <main id="details">
    <header class="popup-header">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span><strong>남은 한도</strong><small>CODEPET LIMITS</small></span>
      </div>
      <button id="close" class="icon-button" type="button" aria-label="닫기">×</button>
    </header>
    <div class="section-title-row">
      <h1>현재 로그인 계정</h1>
      <button id="refresh" class="text-button" type="button">새로고침</button>
    </div>
    <div id="providers" aria-live="polite"><p class="empty">로그인 상태 확인 중…</p></div>
    <footer><span id="status">자동 갱신</span><button id="accounts" class="text-button" type="button">계정 관리</button></footer>
  </main>

</html>
